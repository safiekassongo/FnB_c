services:
  - type: web
    name: fnb-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: fnb-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/fnb.db
      - key: PUBLISHER_TOKENS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
